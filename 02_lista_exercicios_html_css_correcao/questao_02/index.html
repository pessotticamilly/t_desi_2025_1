<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Questão 02</title>
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
        <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-brands/css/uicons-brands.css'>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header></header>
        <main>
            <section>
                <div class="presentationDiv">
                    <div class="imgDiv">
                        <img src="./assets/espaguete_bolonhesa.png" alt="Espaguete à Bolonhesa">
                    </div>
                    <div class="titleDiv">
                        <h1>Espaguete à Bolonhesa</h1>
                        <p>Clássico, saboroso e perfeito para qualquer ocasião.</p>
                        <p>Uma receita fácil e irresistível!</p>
                        <div class="rateDiv">
                            <div>
                                <i class="fi fi-sr-star"></i>
                                <i class="fi fi-sr-star"></i>
                                <i class="fi fi-sr-star"></i>
                                <i class="fi fi-rr-star-sharp-half-stroke"></i>
                                <i class="fi fi-rr-star"></i>
                            </div>
                            <p>3,5</p>
                            <p>234 avaliações</p>
                        </div>
                        <div class="specificationsDiv">
                            <div class="specification borderRadiusLeft">
                                <i class="fi fi-rr-clock-three"></i>
                                <p>Tempo de preparo</p>
                                <p>30 minutos</p>
                            </div>
                            <div class="specification noBorderSides">
                                <i class="fi fi-rr-holding-hand-dinner"></i>
                                <p>Rende</p>
                                <p>4 porções</p>
                            </div>
                            <div class="specification borderRadiusRight">
                                <i class="fi fi-rr-hat-chef"></i>
                                <p>Dificuldade</p>
                                <p>Fácil</p>
                            </div>
                        </div>
                    </div>
                    <div class="shareDiv">
                        <div class="rouded whatsapp">
                            <i class="fi fi-brands-whatsapp"></i>
                        </div>
                        <div class="rouded facebook">
                            <i class="fi fi-brands-facebook"></i>
                        </div>
                        <div class="rouded messenger">
                            <i class="fi fi-brands-facebook-messenger"></i>
                        </div>
                        <div class="rouded instagram">
                            <i class="fi fi-brands-instagram"></i>
                        </div>
                        <div class="rouded">
                            <i class="fi fi-rr-link-alt"></i>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
