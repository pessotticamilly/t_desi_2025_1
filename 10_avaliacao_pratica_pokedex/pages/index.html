<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pokédex</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
        <link rel="stylesheet" href="../styles/style.css">
        <script src="../scripts/script.js" defer></script>
    </head>
    <body>
        <header class="header py-4 mb-4">
            <div class="container">
                <div class="text-center">
                    <img src="../assets/logo-image.png" alt="Logo Pokemon Image" width="200px">
                </div>
            </div>
        </header>
        <main class="container">
            <!-- FILTROS-->
            <section class="filters mb-4">
                <div class="row g-3">
                    <div class="col-12 col-lg-4">
                        <label for="searchInput" class="form-label fw-bold">Pesquisar</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Nome ou número...">
                    </div>
                    <div class="col-12 col-md-4 col-lg-2">
                        <label for="typeFilter" class="form-label fw-bold">Tipo</label>
                        <select id="typeFilter" class="form-select">
                            <option value="all">Todos</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4 col-lg-3">
                        <label for="statFilter" class="form-label fw-bold">Atributo</label>
                        <select id="statFilter" class="form-select">
                            <option value="all">Todos</option>
                            <option value="hp">HP</option>
                            <option value="attack">Ataque</option>
                            <option value="defense">Defesa</option>
                            <option value="special-attack">Ataque Especial</option>
                            <option value="special-defense">Defesa Especial</option>
                            <option value="speed">Velocidade</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4 col-lg-3">
                        <label for="statValue" class="form-label fw-bold">Valor mínimo</label>
                        <input type="number" id="statValue" class="form-control" placeholder="Ex: 80" min="0">
                    </div>
                </div>
            </section>
            <!-- CONTADOR -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <p id="resultCount" class="mb-0 text-muted">Carregando Pokémon...</p>
            </div>
            <!-- LOADING -->
            <div id="loading" class="text-center py-5">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">
                        Carregando...
                    </span>
                </div>
                <p class="mt-3">Carregando Pokémon...</p>
            </div>
            <!-- MENSAGEM DE ERRO -->
            <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                Não foi possível carregar os Pokémon.
            </div>
            <!-- GRID DOS POKÉMON -->
            <section id="pokemonGrid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-3">
            </section>
            <!-- PAGINAÇÃO -->
            <nav class="d-flex justify-content-center my-5" aria-label="Paginação">
                <ul id="pagination" class="pagination"></ul>
            </nav>
        </main>
        <!-- MODAL -->
        <div class="modal fade" id="pokemonModal" tabindex="-1" aria-labelledby="pokemonModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title fs-4" id="pokemonModalLabel">Pokémon</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div id="modalBody" class="modal-body">
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
