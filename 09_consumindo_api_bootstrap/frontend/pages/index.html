<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fetch - Consumindo APIs</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
        <link rel="stylesheet" href="../styles/style.css">
        <script src="../scripts/script.js" defer></script>
    </head>
    <body>
        <header></header>
        <main>
            <section>
                <form class="row p-5">
                    <div class="col-4">
                        <label for="cep" class="form-label">CEP: </label>
                        <input id="cep" class="form-control" type="number">
                    </div>
                    <div class="col-4">
                        <label for="pais" class="form-label">País: </label>
                        <input id="pais" class="form-control" type="text" value="Brasil" disabled>
                    </div>
                    <div class="col-4">
                        <label for="estado" class="form-label">Estado: </label>
                        <input id="estado" class="form-control" type="text">
                    </div>
                    <div class="col-6">
                        <label for="cidade" class="form-label">Cidade: </label>
                        <input id="cidade" class="form-control" type="text">
                    </div>
                    <div class="col-6">
                        <label for="bairro" class="form-label">Bairro: </label>
                        <input id="bairro" class="form-control" type="text">
                    </div>
                    <div class="col-10">
                        <label for="rua" class="form-label">Rua: </label>
                        <input id="rua" class="form-control" type="text">
                    </div>
                    <div class="col-2">
                        <label for="numero" class="form-label">Número: </label>
                        <input id="numero" class="form-control" type="number">
                    </div>
                </form>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
